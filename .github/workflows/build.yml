name: Build & Release Student+

on:
  push:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version Bump
        id: version
        run: |
          GRADLE_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION="v${GRADLE_VER:-1.0}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          
          if git tag -l | grep -q "^${VERSION}$"; then
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build App
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign App
        if: steps.version.outputs.is_new == 'true'
        id: sign_app
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        if: steps.version.outputs.is_new == 'true'
        id: rename_apk
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION="${{ steps.version.outputs.tag }}"
          
          TARGET_FILE=$(find app/build/outputs/apk/release/ -type f \( -name "*-signed.apk" -o -name "*.apk" \) | head -n 1)

          if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
            NEW_NAME="StudentPlus-${VERSION}-${SHORT_SHA}.apk"
            NEW_PATH="app/build/outputs/apk/release/${NEW_NAME}"
            mv "$TARGET_FILE" "$NEW_PATH"
            echo "apk_path=${NEW_PATH}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.version.outputs.is_new == 'true'
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: ${{ steps.rename_apk.outputs.apk_path }}
          generateReleaseNotes: true
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} 
          makeLatest: true
