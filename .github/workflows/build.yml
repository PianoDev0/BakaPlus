name: Build & Sign BakaPlus APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          ls -la app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assemble --stacktrace

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename_apk
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          ORIGINAL_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          DIR=$(dirname "$ORIGINAL_PATH")
          
          # Název ve tvaru: BakaPlus-v1.0-a1b2c3d.apk
          NEW_NAME="BakaPlus-v1.0-${SHORT_SHA}.apk"
          NEW_PATH="${DIR}/${NEW_NAME}"
          
          mv "$ORIGINAL_PATH" "$NEW_PATH"
          
          echo "apk_path=${NEW_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
