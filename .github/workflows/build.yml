name: Build & Release BakaPlus

on:
  push:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: regex-match
        uses: kaisugi/action-regex-match@v1.0.2
        with:
          text: ${{ github.event.head_commit.message }}
          regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build App
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign App
        if: ${{ steps.regex-match.outputs.match != '' }}
        id: sign_app
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename_apk
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          MATCHED_VER="${{ steps.regex-match.outputs.match }}"
          
          if [ -n "$MATCHED_VER" ]; then
            VERSION="$MATCHED_VER"
            TARGET_FILE=$(find app/build/outputs/apk/release/ -name "*-signed.apk" -o -name "*-release.apk" | head -n 1)
          else
            VERSION="dev"
            TARGET_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi

          if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
            NEW_NAME="BakaPlus-${VERSION}-${SHORT_SHA}.apk"
            NEW_PATH="app/build/outputs/apk/release/${NEW_NAME}"
            mv "$TARGET_FILE" "$NEW_PATH"
            echo "apk_path=${NEW_PATH}" >> $GITHUB_OUTPUT
            echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build Changelog
        if: ${{ steps.regex-match.outputs.match != '' }}
        id: changelog
        uses: ardalanamini/auto-changelog@v5.0.0
        with:
          mention-authors: false
          mention-new-contributors: false
          include-compare: false
          semver: false

      - name: Create Release
        if: ${{ steps.regex-match.outputs.match != '' }}
        id: create_release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: ${{ steps.rename_apk.outputs.apk_path }}
          body: ${{ steps.changelog.outputs.changelog }}
          tag: ${{ github.event.head_commit.message }}
          name: Release ${{ github.event.head_commit.message }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        if: ${{ steps.regex-match.outputs.match == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}